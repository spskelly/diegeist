name: Headless playtest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npm run playtest -- fighter 900
